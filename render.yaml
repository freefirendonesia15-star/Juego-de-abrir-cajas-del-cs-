services:
  - type: web
    name: case-sim
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: case-sim-data
      mountPath: /opt/render/project/src
      sizeGB: 1
